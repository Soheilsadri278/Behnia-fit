name: انتشار روی GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      # همهٔ صفحه‌های HTML منتشر می‌شوند تا هیچ لینکی ۴۰۴ ندهد.
      # server.js، lib/ و data/ هرگز منتشر نمی‌شوند: کد سرور است و
      # دیتابیس کاربران. صفحه‌های حساب روی Pages پیام روشن نشان می‌دهند
      # که به سرور نیاز دارند.
      - name: آماده‌سازی فایل‌های سایت
        run: |
          mkdir -p _site
          cp *.html .nojekyll _site/
          cp -r assets _site/
          echo "تعداد فایل‌های منتشرشده: $(find _site -type f | wc -l)"
          test -f _site/index.html
          test -f _site/privacy.html
          test -f _site/404.html
          test -f _site/login.html
          test -f _site/account.html
          test -f _site/admin.html
          test -f _site/assets/css/style.css
          test -f _site/assets/css/app.css
          test -f _site/assets/js/main.js
          test -f _site/assets/js/account.js
          test -f _site/assets/img/trainer-hero.jpg
          # محافظ: کد سرور و دیتابیس هرگز نباید داخل بسته باشد
          test ! -e _site/server.js
          test ! -e _site/lib
          test ! -e _site/data
          test ! -e _site/ACCOUNTS.md

      - name: پیکربندی Pages
        uses: actions/configure-pages@v5

      - name: بارگذاری آرشیو
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: انتشار
        id: deployment
        uses: actions/deploy-pages@v4
